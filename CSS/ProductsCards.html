    <style>
        * {
            margin: 0;

            box-sizing: border-box;
        }

        main {
            height: 150vh;
            width: 100%;
            background: linear-gradient(to right, #348ac7, #7474bf);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;

        }
        .productCard{
            height: 250px;
            width: 200px;
            border: 2px solid orangered;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
        }
        .productCard>img{
            height: 150px;
            width: 150px;
            border-radius: 50%;
        }

        .productCard button{
            height: 30px;
            width: 150px;
            background-color: orange;
            color: aliceblue;
            border: none;
            border-radius: 10px;
        }
        .productCard button:hover{
            background-color: orangered;
            color: aliceblue;
        }
    </style>
</head>
