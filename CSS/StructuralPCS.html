<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-child{
            background-color: aqua;
        }
        li:last-child{
            background-color: magenta;
        }
        li:nth-child(4){
            background-color: burlywood;
        }
    </style>
</head>
<body>
    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>MERN</li>
        <li>MEAN</li>
        <li>DevOps</li>
        <li>Testing</li>
    </ol>
</body>
</html>
