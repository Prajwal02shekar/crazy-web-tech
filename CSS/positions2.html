<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            height: 400px;
            width: 400px;
            border: 2px solid red;
            position: relative;

        }
        aside{
            height: 100px;
            width: 100px;
        }
        #c1{
            background-color: red;
            position: absolute;
            right: 0;
        }
        #c2{
            background-color: blueviolet;
            position: absolute;
            right: 0;
            bottom: 0;
        }
        #c3{
            background-color: yellow;
            position: absolute;
            bottom: 0;
        }
        #c4{
            background-color: aqua;
            position: absolute;
            top: 150px;
            left: 150px;
        
        }
        #c5{
            background-color: hotpink;
        }
    </style>
</head>
<body>
    <main>
        <aside id="c1"></aside>
        <aside id="c2"></aside>
        <aside id="c3"></aside>
        <aside id="c4"></aside>
        <aside id="c5"></aside>
    </main>
</body>
</html>
