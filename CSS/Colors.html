<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height: 600px;
            width: 600px;
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }
        aside{
            height: 150px;
            width: 150px;
            border: 2px solid red;
        }
        #c1{
            background-color:orange;
        }
        #c2{
            background-color: #a420bc;
        }
        #c3{
            background-color: rgb(73, 217, 15);
        }
        #c4{
            background-color: rgba(73, 217, 15, 0.1);
        }
        #c5{
            background-color: hsl(56, 86%, 49%);
        }
        #c6{
            background-color: hsla(56, 86%, 49%, 0.3);
        }
    </style>
</head>
<body>
    <section>
        <aside id="c1"></aside>
        <aside id="c2"></aside>
        <aside id="c3"></aside>
        <aside id="c4"></aside>
        <aside id="c5"></aside>
        <aside id="c6"></aside>
    </section>
</body>
</html>
