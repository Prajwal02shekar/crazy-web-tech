<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Application Form</legend>
            <label for="username">Enter Your Name:</label>
            <input type="text" placeholder="Enter Your Name:" id="username" name="username"><br><br>

            <label for="age">Enter Your Age:</label>
            <input type="number" placeholder="Enter Your Age:" id="age" name="age"><br><br>

            <label for="phNum">Enter Your Ph Num:</label>
            <input type="tel" placeholder="Enter Your ph Num:" id="phNum" name="phNum" minlength="10"
                maxlength="10"><br><br>

            <label for="dob">Enter Your DOB:</label>
            <input type="date" placeholder="Enter Your DOB:" id="dob" name="dob"><br><br>

            <label for="email">Enter Your email:</label>
            <input type="email" placeholder="Enter Your Email:" id="email" name="email"><br><br>

            <label for="imageUrl">Enter Your Image URL:</label>
            <input type="url" placeholder="Enter Your imageUrl:" id="imageUrl" name="imageUrl"><br><br>
            <button>Submit</button>
            <button>Reset </button>


        </fieldset>
    </form>

    <section id="container">

    </section>
</body>
<script src="./index.js"></script>

</html>
