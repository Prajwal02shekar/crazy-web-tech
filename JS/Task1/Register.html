<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>SigUp</legend>
            <label for="username">Enter Username:</label>
            <input type="text" id="username" placeholder="Enter Username" name="username"><br><br>
            <label for="email">Enter Email</label>
            <input type="email" id="email" placeholder="Enter Email" name="email"><br><br>
            <label for="passowrd">Enter Password:</label>
            <input type="password" id="passowrd" placeholder="Enter Password" name="password"><br><br>
            <label for="phNum">Enter Ph Number:</label>
            <input type="tel" placeholder="Enter Ph Number" id="phNum" name="phNum" minlength="10" maxlength="10"><br><br>
            <label for="age">Enter Age:</label>
            <input type="number" id="age" placeholder="Enter Age" name="age"><br><br>
            <label for="dob">Enter DOB:</label>
            <input type="date" id="dob" placeholder="Enter DOB" name="dob"> <br><br>
            <button>Submit</button>
            <button>Reset</button>
        </fieldset>
    </form>
</body>
<script src="./Register.js"></script>

</html>
